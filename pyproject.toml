[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myai"
version = "0.1.0"
description = "A local-only custom neural coding agent"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
myai = "cli_interface.repl:main"

[tool.setuptools]
packages = ["core_engine", "agent_runtime", "tools", "cli_interface", "utils"]
