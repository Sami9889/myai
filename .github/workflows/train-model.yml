name: Train Local Model

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      training_queries:
        description: 'Comma-separated search queries/topics to train on'
        required: false
        default: 'Python programming,artificial intelligence,machine learning,software engineering,data structures,web development,computer science'
        type: string
      epochs:
        description: 'How many full passes over the training data to perform'
        required: false
        default: '5'
        type: number
      learning_rate:
        description: 'Step size for gradient updates. Lower = slower/more stable, higher = faster/more aggressive'
        required: false
        default: '0.05'
        type: string
      max_chars:
        description: 'Maximum characters of web text to fetch for training'
        required: false
        default: '20000'
        type: number
      time_limit_minutes:
        description: 'Maximum workflow runtime in minutes'
        required: false
        default: '120'
        type: number

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT || '' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install requests

      - name: Show training configuration
        run: |
          echo "Training queries: ${{ inputs.training_queries }}"
          echo "Epochs: ${{ inputs.epochs || 5 }}"
          echo "Learning rate: ${{ inputs.learning_rate || 0.05 }}"
          echo "Max chars: ${{ inputs.max_chars || 20000 }}"
          echo "Time limit: ${{ inputs.time_limit_minutes || 120 }} minutes"
          echo "Runner: ${{ runner.os }}"
          echo "Python: $(python3 --version)"
          echo "Memory: $(free -h | grep Mem | awk '{print $2}')"
          echo "PAT secret set: ${{ secrets.PAT != '' }}"

      - name: Generate local model if missing
        run: |
          if [ ! -f models/local_model.bin ] || [ ! -f models/tokenizer.json ]; then
            echo "Generating local model..."
            PYTHONPATH=. python3 tools/generate_model.py
          else
            echo "Local model already exists, skipping generation."
          fi

      - name: Train model on web data
        env:
          PYTHONPATH: .
          TRAINING_QUERIES: ${{ inputs.training_queries }}
          EPOCHS: ${{ inputs.epochs || 5 }}
          LEARNING_RATE: ${{ inputs.learning_rate || 0.05 }}
          MAX_CHARS: ${{ inputs.max_chars || 20000 }}
          TIME_LIMIT_MINUTES: ${{ inputs.time_limit_minutes || 120 }}
        run: |
          echo "Starting training..."
          echo "Queries: $TRAINING_QUERIES"
          echo "Epochs: $EPOCHS"
          echo "Learning rate: $LEARNING_RATE"
          echo "Max chars: $MAX_CHARS"
          echo "Time limit: $TIME_LIMIT_MINUTES minutes"
          echo "Sources: 51+ sources including Bing, Wikipedia, Stack Overflow, arXiv, GitHub, Hacker News, Reddit, Wiktionary, Wikiquote, Wikidata, OpenLibrary, PubMed, CrossRef, Europe PMC, GeoNames, Nominatim, REST Countries, Open Notify, Sunrise, Wikipedia Random, DuckDuckGo, Open Trivia DB, JokeAPI, Cat Facts, Dog Facts, Bored API, Advice Slip, Kanye Rest, Random User, Random Data, Numbers API, IP API, Timezone, Exchange Rate, CoinGecko, CoinCap, MetaWeather, MealDB, Cocktail DB, Open Food Facts, PubChem, ChEMBL, ClinicalTrials, Launch Library, SpaceX, ISS, Earthquake, Wikimedia Commons, Wikisource, Wikinews, Wikivoyage"
          python3 tools/train_model.py

      - name: Upload trained model
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: |
            models/local_model.bin
            models/tokenizer.json
          retention-days: 30

      - name: Commit trained weights
        if: github.ref == 'refs/heads/main'
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "PAT secret not set. Skipping commit/push. Uploaded model as artifact instead."
            exit 0
          fi
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git remote set-url origin https://x-access-token:${PAT}@github.com/Sami9889/myai.git
          git add models/local_model.bin models/tokenizer.json
          git diff --cached --quiet || git commit -m "chore(model): retrain local model weights"
          git push origin main
